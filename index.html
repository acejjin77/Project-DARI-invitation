<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초대장</title>
    <style>
        /* body의 background-color를 #000000(검은색)으로 변경했습니다. */
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #000000; padding: 20px; }
        .card { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        /* 추가된 이미지 스타일: 영역을 벗어나지 않고 모서리를 둥글게 처리 */
        .invite-image { width: 100%; height: auto; border-radius: 10px; margin-bottom: 20px; }
        
        h1 { color: #333; margin-top: 0; }
        p { color: #666; line-height: 1.6; margin: 5px 0; }
        
        .button { display: inline-block; padding: 10px 20px; margin-top: 10px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; width: 80%; box-sizing: border-box; }
        
        /* === 계좌번호 영역 스타일 추가 === */
        .account-box { margin-top: 30px; padding: 20px; background-color: #f8f9fa; border-radius: 10px; border: 1px solid #eee; text-align: left; }
        .account-title { font-weight: bold; color: #333; margin-bottom: 10px; text-align: center; font-size: 1.1em; }
        .account-info { margin-bottom: 15px; border-bottom: 1px dashed #ccc; padding-bottom: 10px; }
        .account-info:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        .bank-name { font-size: 14px; font-weight: bold; color: #555; }
        .account-number { font-size: 15px; color: #333; margin: 5px 0; }
        .copy-btn { display: block; width: 100%; padding: 8px; margin-top: 5px; background-color: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; text-align: center; }
        .copy-btn:hover { background-color: #5a6268; }
    </style>
</head>
<body>
    <div class="card">
        <img src="TESTIMG.jpg" alt="초대장 메인 사진" class="invite-image">

        <h1>초대합니다!</h1>
        <p>테스트 문구입니다.<br>
            테스트 문구입니다.<br>
            테스트 문구입니다.<br>
            테스트 문구입니다.
        </p>
        <p><strong>일시:</strong> 2026년 O월 O일 O시</p>
        <p><strong>장소:</strong> OOO</p>
        
        <a href="tel:010-1234-5678" class="button">참석 여부 알려주기 (전화 주세용)</a>
        
        <a href="sms:010-1234-5678" class="button">참석 여부 알려주기 (문자 주세용)</a>

        <div class="account-box">
            <p class="account-title">마음 전하실 곳</p>
            
            <div class="account-info">
                <span class="bank-name">OO은행 (예금주: 홍길동)</span>
                <p class="account-number">123-4567-8901-23</p>
                <button class="copy-btn" onclick="copyAccount('1234567890123')">계좌번호 복사</button>
            </div>

            <div class="account-info">
                <span class="bank-name">OO은행 (예금주: 김철수)</span>
                <p class="account-number">987-6543-2109-87</p>
                <button class="copy-btn" onclick="copyAccount('9876543210987')">계좌번호 복사</button>
            </div>
        </div>
        </div>

    <script>
        function copyAccount(accountNumber) {
            // 클립보드에 텍스트 복사하는 최신 API
            navigator.clipboard.writeText(accountNumber).then(function() {
                alert('계좌번호가 복사되었습니다. (' + accountNumber + ')');
            }).catch(function(err) {
                alert('복사에 실패했습니다. 직접 드래그해서 복사해주세요.');
            });
        }
    </script>
</body>
</html>
